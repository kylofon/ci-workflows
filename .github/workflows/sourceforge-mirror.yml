name: SourceForge Mirror (reusable)

on:
  workflow_call:
    inputs:
      sf_project:
        description: SourceForge project unix name (the SLUG in /p/SLUG/code)
        required: true
        type: string
      sf_user:
        description: SourceForge username used for SSH auth
        required: false
        default: kylofon
        type: string
      branch:
        description: Branch name to push on SourceForge. Defaults to the branch that triggered the run.
        required: false
        default: ''
        type: string
    secrets:
      SF_SSH_KEY:
        description: Private half of the ed25519 deploy key registered on the SourceForge account
        required: true

concurrency:
  group: sf-mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
        run: |
          if [ -z "${SF_SSH_KEY//[[:space:]]/}" ]; then
            echo "::error::SF_SSH_KEY is empty. Add the SourceForge private key as an" \
                 "Actions *repository* secret named SF_SSH_KEY in ${GITHUB_REPOSITORY}" \
                 "(Settings > Secrets and variables > Actions > Repository secrets)." \
                 "Environment and Dependabot secrets are not visible here."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SF_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "::error::SF_SSH_KEY is set but is not a usable private key." \
                 "Copy the whole file including the BEGIN/END lines and a trailing newline."
            exit 1
          fi
          ssh-keyscan -t rsa,ecdsa,ed25519 git.code.sf.net >> ~/.ssh/known_hosts

      - name: Push to SourceForge
        env:
          SF_REMOTE: ssh://${{ inputs.sf_user }}@git.code.sf.net/p/${{ inputs.sf_project }}/code
          BRANCH_INPUT: ${{ inputs.branch }}
        run: |
          target="${BRANCH_INPUT:-$GITHUB_REF_NAME}"
          git remote add sourceforge "$SF_REMOTE" 2>/dev/null \
            || git remote set-url sourceforge "$SF_REMOTE"
          echo "Mirroring $GITHUB_REF_NAME -> $SF_REMOTE ($target)"
          git push --force sourceforge "HEAD:refs/heads/$target"
          git push --force --tags sourceforge
