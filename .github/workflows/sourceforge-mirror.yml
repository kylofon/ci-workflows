name: SourceForge Mirror (reusable)

on:
  workflow_call:
    inputs:
      sf_project:
        description: SourceForge project unix name (the SLUG in /p/SLUG/code)
        required: true
        type: string
      sf_user:
        description: SourceForge username used for SSH auth
        required: false
        default: kylofon
        type: string
      branch:
        description: Branch name to push on SourceForge. Defaults to the branch that triggered the run.
        required: false
        default: ''
        type: string
    secrets:
      SF_SSH_KEY:
        description: Private half of the ed25519 deploy key registered on the SourceForge account
        required: true

concurrency:
  group: sf-mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
        run: |
          if [ -z "${SF_SSH_KEY//[[:space:]]/}" ]; then
            echo "::error::SF_SSH_KEY is empty. Add the SourceForge private key as an" \
                 "Actions *repository* secret named SF_SSH_KEY in ${GITHUB_REPOSITORY}" \
                 "(Settings > Secrets and variables > Actions > Repository secrets)." \
                 "Environment and Dependabot secrets are not visible here."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SF_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            # Report the key's shape, never its body. BEGIN/END markers and a
            # line count are not sensitive; the base64 payload is.
            lines=$(wc -l < ~/.ssh/id_ed25519)
            first=$(head -n 1 ~/.ssh/id_ed25519)
            last=$(tail -n 1 ~/.ssh/id_ed25519)
            # Match the marker anywhere on the line: when the newlines are lost
            # the whole key collapses into one BEGIN...body...END line.
            case "$first" in
              *"PRIVATE KEY"*) hdr="ok" ;;
              *"PUBLIC KEY"*|"ssh-ed25519 "*|"ssh-rsa "*|"ecdsa-sha2-"*) hdr="public" ;;
              *) hdr="bad" ;;
            esac
            echo "::error::SF_SSH_KEY is set but is not a usable private key."
            echo "  line count : $lines"
            echo "  first line : $first"
            echo "  last line  : $last"
            case "$hdr:$lines" in
              public:*)
                echo "  -> This is the PUBLIC key. The secret needs the private half" \
                     "(the sourceforge_deploy file, not sourceforge_deploy.pub)." ;;
              ok:0|ok:1)
                echo "  -> Header is right but the key is on a single line: the newlines" \
                     "were lost when it was pasted. Re-copy it so every line is preserved," \
                     "e.g. 'gh secret set SF_SSH_KEY < sourceforge_deploy'." ;;
              ok:*)
                echo "  -> Header and line breaks look right, so the base64 body is" \
                     "truncated or altered. Re-copy the file whole." ;;
              *)
                echo "  -> No BEGIN marker found. The secret does not hold an OpenSSH" \
                     "private key." ;;
            esac
            exit 1
          fi
          ssh-keyscan -t rsa,ecdsa,ed25519 git.code.sf.net >> ~/.ssh/known_hosts

      - name: Push to SourceForge
        env:
          SF_REMOTE: ssh://${{ inputs.sf_user }}@git.code.sf.net/p/${{ inputs.sf_project }}/code
          BRANCH_INPUT: ${{ inputs.branch }}
        run: |
          target="${BRANCH_INPUT:-$GITHUB_REF_NAME}"
          git remote add sourceforge "$SF_REMOTE" 2>/dev/null \
            || git remote set-url sourceforge "$SF_REMOTE"
          echo "Mirroring $GITHUB_REF_NAME -> $SF_REMOTE ($target)"
          git push --force sourceforge "HEAD:refs/heads/$target"
          git push --force --tags sourceforge
