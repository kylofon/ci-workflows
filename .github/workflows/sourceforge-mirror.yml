name: Sourceforge Mirror (reusable)

on:
  workflow_call:
    inputs:
      sf_project:
        required: true
        type: string
    secrets:
      SF_SSH_KEY:
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SF_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t rsa,ecdsa,ed25519 git.code.sf.net >> ~/.ssh/known_hosts

      - name: Push to SourceForge
        run: |
          git remote add sourceforge ssh://kylofon@git.code.sf.net/p/${{ inputs.sf_project }}/code
          git push sourceforge main --force
          git push sourceforge --tags --force
